name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master", "gh-pages"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.check_source.outputs.needs_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if source build is required
        id: check_source
        run: |
          if grep -q '/src/main.tsx' index.html; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.check_source.outputs.needs_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.check_source.outputs.needs_build == 'true'
        run: npm ci --no-audit --no-fund || (rm -f package-lock.json && npm install --no-audit --no-fund)

      - name: Build static frontend
        if: steps.check_source.outputs.needs_build == 'true'
        env:
          VITE_BASE_PATH: "./"
        run: |
          npx vite build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish built bundle to gh-pages branch
        if: steps.check_source.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.ref_name }}" != "gh-pages" ]; then
            git checkout -B gh-pages
          fi
          cp -rf dist/* .
          cp -f dist/index.html 404.html
          touch .nojekyll
          git add -f index.html 404.html .nojekyll assets/ sw.js || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish compiled static bundle to gh-pages"
            git push origin HEAD:gh-pages --force
            gh api -X POST "/repos/${{ github.repository }}/pages/builds" || true
          fi

      - name: Upload Pages artifact
        if: steps.check_source.outputs.needs_build == 'true'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
